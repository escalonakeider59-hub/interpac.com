<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal INTERPAC - Pagos y Soporte</title>
    <style>
        :root { --primary: #0056b3; --whatsapp: #25d366; --support: #ff9800; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 5px; }
        
        /* Secciones Informativas */
        .info-box { border-radius: 10px; padding: 15px; margin-bottom: 20px; border: 1px solid #ddd; }
        .pago-box { background: #eef6ff; border-color: #d1e7ff; }
        .soporte-box { background: #fff4e5; border-color: #ffe0b2; }
        
        h3 { margin: 0 0 10px 0; font-size: 16px; display: flex; align-items: center; }
        .cuenta-item { font-size: 14px; line-height: 1.6; color: #333; }
        
        /* Formulario */
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        /* Botones */
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; transition: 0.3s; color: white; }
        .btn-pago { background-color: var(--whatsapp); box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .btn-soporte { background-color: var(--support); margin-top: 5px; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="card">
    <h2>INTERPAC</h2>
    <p style="text-align:center; color: #666; margin-bottom: 20px;">Panel de Atención al Cliente</p>
    
    <!-- SECCIÓN DE SOPORTE -->
    <div class="info-box soporte-box">
        <h3 style="color: #e65100;">🛠️ Soporte Técnico</h3>
        <p style="font-size: 13px; margin: 5px 0;">¿Tienes problemas con tu conexión? Reporta una falla ahora:</p>
        <button class="btn btn-soporte" onclick="contactarSoporte()">Reportar Falla Técnica</button>
    </div>

    <!-- DATOS DE PAGO -->
    <div class="info-box pago-box">
        <h3 style="color: var(--primary);">💳 Datos de Pago Móvil</h3>
        <div class="cuenta-item">
            <strong>Banco:</strong> Digital de los Trabajadores (0175)<br>
            <strong>Cédula:</strong> 27.692.319<br>
            <strong>Teléfono:</strong> 04142460333<br>
            <strong>Monto:</strong> $25
        </div>
    </div>

    <!-- FORMULARIO DE REPORTE -->
    <form id="pagoForm">
        <h3 style="font-size: 15px; margin-top: 20px;">📋 Reportar Mensualidad</h3>
        <label>Nombre del Cliente</label>
        <input type="text" id="nombre" placeholder="Nombre completo" required>

        <label>Sector</label>
        <select id="sector" required>
            <option value="">Seleccione su ubicación</option>
            <option value="Belén Gamelotal">Belén Gamelotal</option>
            <option value="Belén la Vega">Belén la Vega</option>
            <option value="Otro">Otro sector</option>
        </select>

        <label>Plan</label>
        <select id="plan" required>
            <option value="25 Mbps">25 Mbps</option>
            <option value="50 Mbps">50 Mbps</option>
            <option value="100 Mbps">100 Mbps</option>
        </select>

        <label>Referencia</label>
        <input type="text" id="referencia" placeholder="Últimos 6 dígitos" required>

        <button type="button" class="btn btn-pago" onclick="enviarPago()">Reportar Pago vía WhatsApp</button>
    </form>
</div>

<script>
    const tlf = "584142460333";

    function enviarPago() {
        const nombre = document.getElementById('nombre').value;
        const sector = document.getElementById('sector').value;
        const plan = document.getElementById('plan').value;
        const referencia = document.getElementById('referencia').value;

        if(!nombre || !sector || !referencia) {
            alert("Por favor, llena los datos del pago.");
            return;
        }

        const mensaje = `Hola *INTERPAC*, envío mi reporte de pago:\n\n👤 *Cliente:* ${nombre}\n📍 *Sector:* ${sector}\n⚡ *Plan:* ${plan}\n🔢 *Ref:* ${referencia}\n💵 *Monto:* $25`;
        window.open(`https://wa.me/${tlf}?text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    function contactarSoporte() {
        const mensajeSoporte = "Hola *INTERPAC*, necesito *Soporte Técnico*. Mi conexión presenta fallas. Quedo atento a su respuesta.";
        window.open(`https://wa.me/${tlf}?text=${encodeURIComponent(mensajeSoporte)}`, '_blank');
    }
</script>

</body>
</html>
